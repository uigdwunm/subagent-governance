name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python scripts
        run: >-
          python -m py_compile
          scripts/subagent_governance.py
          scripts/apply_agents_block.py
          scripts/check_installation.py
          scripts/reinstall_preserving_caches.py
          scripts/release_preflight.py
      - name: Validate plugin, Skill, versions, and public content
        run: python scripts/release_preflight.py --mode development
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Validate git archive release candidate
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        shell: bash
        run: |
          archive_root="$(mktemp -d)"
          git archive --format=tar HEAD | tar -xf - -C "$archive_root"
          python "$archive_root/scripts/release_preflight.py" \
            --root "$archive_root" \
            --mode archive
      - name: Enforce release tag and Marketplace ref
        if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          python scripts/release_preflight.py
          --mode release
          --tag "$RELEASE_TAG"
