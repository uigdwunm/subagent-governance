name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development checks
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python scripts
        run: python -m compileall -q scripts
      - name: Lint Python
        run: ruff check scripts tests
      - name: Validate portable plugin and Skill contract, versions, and public content
        run: python scripts/release_preflight.py --mode development
      - name: Run tests
        if: matrix.os != 'ubuntu-latest' || matrix.python-version != '3.11'
        run: python -m unittest discover -s tests -v
      - name: Run tests with branch coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: coverage run -m unittest discover -s tests -v && coverage report
      - name: Validate git release archive
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        shell: bash
        run: |
          archive_root="$(mktemp -d)"
          git archive --format=tar HEAD | tar -xf - -C "$archive_root"
          python "$archive_root/scripts/release_preflight.py" \
            --root "$archive_root" \
            --mode archive
      - name: Enforce release tag and Marketplace ref
        if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          python scripts/release_preflight.py
          --mode release
          --tag "$RELEASE_TAG"
